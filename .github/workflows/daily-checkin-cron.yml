name: Daily Check-in Email at 11 PM PKT

on:
  schedule:
    # 11 PM PKT = 4 PM UTC - Daily check-in emails
    # Runs every day at 16:00 UTC (11 PM PKT)
    - cron: '0 16 * * *'
    # 9 AM PKT = 4 AM UTC - Weekly reviews
    # Runs every Monday at 04:00 UTC (9 AM PKT)
    - cron: '0 4 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  send-daily-checkin:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send daily check-in emails
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          CHECKIN_FROM_EMAIL: ${{ secrets.CHECKIN_FROM_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
        run: |
          curl -X POST \
            "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/daily-checkin/send" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            if (context.issue?.number) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '❌ Daily check-in email send failed. Check logs.'
              })
            } else {
              core.warning('Daily check-in email send failed. Check logs.')
            }

  generate-weekly-reviews:
    runs-on: ubuntu-latest
    # Only run on Monday (cron '0 4 * * 1')
    if: github.event.schedule == '0 4 * * 1' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate weekly brutal reviews
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
        run: |
          curl -X PUT \
            "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/weekly-review/generate" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            if (context.issue?.number) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '❌ Weekly review generation failed. Check logs.'
              })
            } else {
              core.warning('Weekly review generation failed. Check logs.')
            }
